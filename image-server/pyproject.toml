[project]
name = "image-server"
version = "0.1.0"
description = "Local MLX image-generation server for the teacher image harness"
license = "PolyForm-Noncommercial-1.0.0"  # see ../LICENSE.md
requires-python = ">=3.12"
dependencies = [
  "mflux==0.23.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "opencv-python>=4.10",
  "python-dotenv>=1.0",
  "pillow>=12.3,<13",
  "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
image-server = "image_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
